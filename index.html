<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thinairatech | Landing Soon</title>
  <meta name="description" content="Thinairatech - landing soon ....">

  <!-- Google Fonts: Fredoka & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================================================================
       Background Scenic World: Mountains, Sky, Train, Road (Travel & Tourism)
       ========================================================================= -->
  <div class="scenic-world" aria-hidden="true">

    <!-- Sky & Clouds -->
    <div class="sky-clouds">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
    </div>

    <!-- Distant Snow-Capped Mountain Range -->
    <svg class="mountains-svg" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <!-- Far Mountain Peaks (Violet / Lavender Mist) -->
      <polygon points="120,320 280,110 460,320" fill="#c7d2fe" stroke="#818cf8" stroke-width="2" />
      <polygon points="280,110 240,165 280,150 320,165" fill="#ffffff" /> <!-- Snow cap -->

      <polygon points="380,320 560,70 760,320" fill="#a5b4fc" stroke="#6366f1" stroke-width="2" />
      <polygon points="560,70 515,130 560,115 605,130" fill="#ffffff" /> <!-- Snow cap -->

      <polygon points="700,320 890,120 1080,320" fill="#c7d2fe" stroke="#818cf8" stroke-width="2" />
      <polygon points="890,120 850,170 890,155 930,170" fill="#ffffff" /> <!-- Snow cap -->

      <polygon points="1020,320 1200,90 1380,320" fill="#a5b4fc" stroke="#6366f1" stroke-width="2" />
      <polygon points="1200,90 1155,145 1200,132 1245,145" fill="#ffffff" /> <!-- Snow cap -->

      <!-- Mid-ground Rolling Foothills (Warm Amber & Green) -->
      <path d="M0,210 Q320,130 680,190 T1440,160 L1440,320 L0,320 Z" fill="#86efac" stroke="#22c55e" stroke-width="2.5"
        opacity="0.8" />
      <path d="M0,240 Q420,170 860,230 T1440,210 L1440,320 L0,320 Z" fill="#4ade80" stroke="#16a34a"
        stroke-width="2.5" />
    </svg>

    <!-- Flying Airplane with colorful travel banner -->
    <div class="travel-plane" id="traveler-plane" title="Click me!">
      <svg viewBox="0 0 180 80" width="160" height="72">
        <path d="M30 42 L130 42 Q145 42 140 30 Q130 18 80 25 L45 10 L35 15 L55 28 L25 30 Z" fill="#38bdf8"
          stroke="#0284c7" stroke-width="2.5" />
        <ellipse cx="105" cy="32" rx="7" ry="5" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
        <!-- Spinning yellow propeller -->
        <ellipse class="propeller-blade" cx="140" cy="30" rx="3" ry="18" fill="#f59e0b" stroke="#b45309"
          stroke-width="1.5" />
        <circle cx="140" cy="30" r="4" fill="#0284c7" />
        <!-- Cute travel luggage hanging -->
        <rect x="10" y="46" width="16" height="12" rx="3" fill="#f43f5e" stroke="#be123c" stroke-width="1.5" />
        <line x1="28" y1="42" x2="18" y2="46" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />
      </svg>
    </div>

    <!-- Railway Track with Chugging Cartoon Train -->
    <div class="railway-zone">
      <!-- Tracks with wooden ties -->
      <div class="train-track">
        <div class="rail-line rail-top"></div>
        <div class="rail-ties"></div>
        <div class="rail-line rail-bottom"></div>
      </div>

      <!-- Colorful Cartoon Express Train -->
      <div class="cartoon-train" id="cartoon-train">
        <!-- Steam Puffs -->
        <div class="train-steam">
          <span class="steam s-1"></span>
          <span class="steam s-2"></span>
          <span class="steam s-3"></span>
        </div>

        <svg viewBox="0 0 240 70" width="220" height="65">
          <!-- Locomotive (Electric Blue & Sunny Gold) -->
          <rect x="140" y="20" width="75" height="36" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.5" />
          <path d="M215 32 L230 46 L215 56 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="2" /> <!-- Cowcatcher -->
          <rect x="195" y="10" width="12" height="12" rx="2" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
          <!-- Chimney -->
          <!-- Cab Windows -->
          <rect x="150" y="26" width="16" height="14" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
          <rect x="174" y="26" width="22" height="14" rx="3" fill="#67e8f9" stroke="#0891b2" stroke-width="2" />
          <!-- Wheels -->
          <circle cx="158" cy="56" r="9" fill="#f43f5e" stroke="#1e293b" stroke-width="2.5" />
          <circle cx="180" cy="56" r="9" fill="#f43f5e" stroke="#1e293b" stroke-width="2.5" />
          <circle cx="204" cy="56" r="9" fill="#f43f5e" stroke="#1e293b" stroke-width="2.5" />

          <!-- Coupler -->
          <rect x="130" y="42" width="12" height="4" fill="#64748b" />

          <!-- Carriage (Vibrant Orange & Mint) -->
          <rect x="55" y="24" width="75" height="32" rx="5" fill="#f97316" stroke="#c2410c" stroke-width="2.5" />
          <!-- Windows with passengers -->
          <rect x="65" y="30" width="14" height="12" rx="2" fill="#67e8f9" stroke="#0891b2" stroke-width="1.5" />
          <rect x="86" y="30" width="14" height="12" rx="2" fill="#67e8f9" stroke="#0891b2" stroke-width="1.5" />
          <rect x="107" y="30" width="14" height="12" rx="2" fill="#67e8f9" stroke="#0891b2" stroke-width="1.5" />
          <!-- Wheels -->
          <circle cx="72" cy="56" r="8" fill="#facc15" stroke="#1e293b" stroke-width="2.5" />
          <circle cx="112" cy="56" r="8" fill="#facc15" stroke="#1e293b" stroke-width="2.5" />
        </svg>
      </div>
    </div>

    <!-- Roadway with Cartoon Car and Bike -->
    <div class="road-zone">
      <div class="asphalt-road">
        <div class="road-stripes"></div>
      </div>

      <!-- Cute Vintage Red Beetle Car (with roof luggage) -->
      <div class="cartoon-car" id="cartoon-car" title="Beep beep!">
        <svg viewBox="0 0 160 80" width="140" height="70">
          <!-- Roof luggage stack (Travel excitement!) -->
          <rect x="58" y="6" width="30" height="14" rx="3" fill="#facc15" stroke="#b45309" stroke-width="2" />
          <rect x="64" y="2" width="18" height="6" rx="2" fill="#06b6d4" stroke="#0e7490" stroke-width="1.5" />
          <line x1="52" y1="20" x2="94" y2="20" stroke="#475569" stroke-width="2" />

          <!-- Car Body (Cherry Coral Red) -->
          <path d="M 25 54 L 30 38 Q 42 22 75 20 Q 112 20 128 36 L 138 46 L 142 54 Z" fill="#ef4444" stroke="#991b1b"
            stroke-width="3" />

          <!-- Windows with friendly travelers -->
          <path d="M 52 36 L 72 36 L 72 24 Q 58 25 52 36 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="2" />
          <path d="M 78 36 L 108 36 Q 102 24 82 24 L 78 24 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="2" />

          <!-- Headlight (Glow yellow) -->
          <circle cx="138" cy="46" r="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
          <path d="M 143 42 L 158 36 L 158 56 L 143 50 Z" fill="#fef08a" opacity="0.35" /> <!-- Light beam -->

          <!-- Spinning Wheels -->
          <circle cx="48" cy="56" r="13" fill="#1e293b" stroke="#94a3b8" stroke-width="2" />
          <circle cx="48" cy="56" r="5" fill="#f8fafc" />
          <circle cx="118" cy="56" r="13" fill="#1e293b" stroke="#94a3b8" stroke-width="2" />
          <circle cx="118" cy="56" r="5" fill="#f8fafc" />
        </svg>
      </div>

      <!-- Cute Colorful Motorbike / Scooter -->
      <div class="cartoon-bike" id="cartoon-bike" title="Vroom!">
        <svg viewBox="0 0 120 75" width="105" height="66">
          <!-- Rider with Aviator Helmet & Flying Scarf -->
          <circle cx="56" cy="18" r="11" fill="#facc15" stroke="#b45309" stroke-width="2.5" /> <!-- Helmet -->
          <ellipse cx="61" cy="18" rx="5" ry="4" fill="#0284c7" /> <!-- Visor -->
          <!-- Flying Coral Scarf -->
          <path class="flying-scarf" d="M 48 24 Q 30 20 22 28 Q 32 30 46 26 Z" fill="#f43f5e" stroke="#be123c"
            stroke-width="1.5" />

          <!-- Scooter Frame (Teal & Lime) -->
          <path d="M 40 50 L 55 50 L 68 32 L 80 32" fill="none" stroke="#06b6d4" stroke-width="4"
            stroke-linecap="round" />
          <path d="M 72 32 L 82 50" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
          <line x1="75" y1="28" x2="85" y2="28" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
          <!-- Handlebar -->

          <!-- Front headlight -->
          <circle cx="85" cy="35" r="4" fill="#fef08a" stroke="#eab308" stroke-width="1.5" />

          <!-- Wheels with Colorful Rims -->
          <circle cx="32" cy="52" r="12" fill="#1e293b" stroke="#4ade80" stroke-width="3" />
          <circle cx="32" cy="52" r="4" fill="#f8fafc" />
          <circle cx="88" cy="52" r="12" fill="#1e293b" stroke="#4ade80" stroke-width="3" />
          <circle cx="88" cy="52" r="4" fill="#f8fafc" />
        </svg>
      </div>
    </div>
  </div>

  <!-- =========================================================================
       Main Foreground Stage: Agri-Tech & Cyber-Security Heroes
       ========================================================================= -->
  <main class="main-stage">

    <div class="cartoon-heroes-scene" aria-label="Funny cartoon animation">

      <!-- HERO 1: The Agri-Tech Sprout (Rich vibrant colors + IoT Smart Drone) -->
      <div class="hero-character agri-hero" id="agri-character" role="button" tabindex="0" title="Click the Sprout!">

        <!-- Smart Agri-Drone hovering overhead -->
        <div class="agri-drone" aria-hidden="true">
          <svg viewBox="0 0 100 50" width="85" height="42">
            <!-- Drone Frame (Vibrant Lime & Tangerine) -->
            <line x1="20" y1="25" x2="80" y2="25" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
            <ellipse cx="50" cy="24" rx="14" ry="10" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
            <!-- Spinning Rotors -->
            <ellipse class="rotor rotor-left" cx="20" cy="18" rx="14" ry="3" fill="#a855f7" stroke="#7e22ce"
              stroke-width="1.5" />
            <ellipse class="rotor rotor-right" cx="80" cy="18" rx="14" ry="3" fill="#a855f7" stroke="#7e22ce"
              stroke-width="1.5" />
            <!-- Digital water / nutrient beam -->
            <path d="M 44 34 L 38 48 L 62 48 L 56 34 Z" fill="url(#nutrient-glow)" opacity="0.6" />
            <defs>
              <linearGradient id="nutrient-glow" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#4ade80" stop-opacity="0" />
              </linearGradient>
            </defs>
          </svg>
          <!-- Sparkling Nutrient Sprinkles -->
          <div class="sparkle-drops">
            <span class="sp-drop sp-1"></span>
            <span class="sp-drop sp-2"></span>
            <span class="sp-drop sp-3"></span>
          </div>
        </div>

        <!-- Goofy Animated Sprout Creature -->
        <svg class="character-svg" viewBox="0 0 170 190" width="160" height="180">
          <!-- Terra-cotta Pot with Smart Digital Gauge -->
          <ellipse cx="85" cy="172" rx="42" ry="10" fill="#0f291e" opacity="0.2" />
          <path d="M 48 140 L 54 172 Q 85 180 116 172 L 122 140 Z" fill="#ea580c" stroke="#9a3412" stroke-width="3.5" />
          <rect x="44" y="134" width="82" height="10" rx="3" fill="#f97316" stroke="#9a3412" stroke-width="3" />
          <!-- Smart Moisture Digital Meter on the pot (Neon Cyan & Green) -->
          <rect x="70" y="150" width="30" height="12" rx="3" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
          <line x1="74" y1="156" x2="88" y2="156" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
          <circle cx="94" cy="156" r="2" fill="#38bdf8" />

          <!-- Cute Sprout Body & Stem -->
          <path class="sprout-stem" d="M 85 134 Q 80 105 85 86" fill="none" stroke="#22c55e" stroke-width="14"
            stroke-linecap="round" />

          <g class="sprout-head-group">
            <!-- Pear Shaped Head with warm gradient -->
            <ellipse cx="85" cy="78" rx="36" ry="34" fill="#4ade80" stroke="#15803d" stroke-width="3.5" />

            <!-- Colorful Blossom Petals on top (Sunshine Coral / Pink) -->
            <g class="blossom-petals">
              <circle cx="85" cy="40" r="10" fill="#f43f5e" stroke="#be123c" stroke-width="2.5" />
              <circle cx="73" cy="44" r="8" fill="#fbbf24" stroke="#b45309" stroke-width="2" />
              <circle cx="97" cy="44" r="8" fill="#fbbf24" stroke="#b45309" stroke-width="2" />
              <circle cx="85" cy="42" r="5" fill="#fef08a" />
            </g>

            <!-- Rosy Cheeks -->
            <ellipse cx="63" cy="85" rx="6" ry="4" fill="#f43f5e" opacity="0.6" />
            <ellipse cx="107" cy="85" rx="6" ry="4" fill="#f43f5e" opacity="0.6" />

            <!-- Big Expressive Googly Eyes -->
            <ellipse cx="71" cy="72" rx="10" ry="12" fill="#ffffff" stroke="#0f291e" stroke-width="3" />
            <circle class="pupil pupil-left" cx="71" cy="72" r="4.5" fill="#0f291e" />
            <circle cx="73" cy="69.5" r="1.5" fill="#ffffff" />

            <ellipse cx="99" cy="72" rx="10" ry="12" fill="#ffffff" stroke="#0f291e" stroke-width="3" />
            <circle class="pupil pupil-right" cx="99" cy="72" r="4.5" fill="#0f291e" />
            <circle cx="101" cy="69.5" r="1.5" fill="#ffffff" />

            <!-- Goofy Smile -->
            <path d="M 76 88 Q 85 98 94 88" fill="none" stroke="#0f291e" stroke-width="3" stroke-linecap="round" />

            <!-- Cool Farmer Bandana / Sunglasses -->
            <path d="M 60 56 Q 85 64 110 56 L 105 50 Q 85 58 65 50 Z" fill="#e11d48" stroke="#9f1239"
              stroke-width="2" />
          </g>
        </svg>

        <span class="click-badge badge-agri">boing!</span>
      </div>

      <!-- HERO 2: The Cyber-Security Guardian (Electric Neon Lines + Laser Scanner) -->
      <div class="hero-character cyber-hero" id="cyber-character" role="button" tabindex="0"
        title="Click the Guardian!">

        <!-- Rotating Holographic Security Ring -->
        <div class="hologram-ring" aria-hidden="true"></div>

        <!-- Laser Scanner Cone scanning the floor -->
        <div class="laser-scanner-cone" aria-hidden="true"></div>

        <!-- Cyber Shield Guardian SVG -->
        <svg class="character-svg" viewBox="0 0 170 190" width="160" height="180">
          <ellipse cx="85" cy="172" rx="44" ry="10" fill="#0f291e" opacity="0.2" />

          <!-- Guardian Body Group -->
          <g class="guardian-body">
            <!-- Antenna with Pulsing Multicolored Orb -->
            <line x1="85" y1="44" x2="85" y2="22" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
            <circle class="pulsing-cyber-orb" cx="85" cy="16" r="8" fill="#06b6d4" stroke="#0891b2"
              stroke-width="2.5" />

            <!-- Heavy Cyber Shield Armor (White plate with Electric Violet & Cyan Lines) -->
            <path d="M 40 44 L 130 44 Q 136 98 85 158 Q 34 98 40 44 Z" fill="#ffffff" stroke="#3b82f6" stroke-width="4"
              stroke-linejoin="round" />

            <!-- Neon Cyan & Violet Circuit Inlay Lines -->
            <path d="M 52 54 L 118 54 Q 122 92 85 142 Q 48 92 52 54 Z" fill="#0f172a" stroke="#8b5cf6"
              stroke-width="3" />

            <!-- High-Tech Circuit Traces -->
            <path d="M 60 62 L 72 62 L 78 72" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
            <circle cx="78" cy="72" r="2.5" fill="#06b6d4" />
            <path d="M 110 62 L 98 62 L 92 72" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
            <circle cx="92" cy="72" r="2.5" fill="#06b6d4" />

            <!-- Digital Visor with Matrix Eyes -->
            <rect x="62" y="76" width="46" height="24" rx="7" fill="#020617" stroke="#38bdf8" stroke-width="2" />
            <rect class="cyber-matrix-eye eye-l" x="69" y="83" width="10" height="10" rx="3" fill="#22c55e" />
            <rect class="cyber-matrix-eye eye-r" x="91" y="83" width="10" height="10" rx="3" fill="#22c55e" />

            <!-- Golden Master Key / Padlock Heart Emblem -->
            <g class="golden-lock">
              <rect x="74" y="112" width="22" height="18" rx="4" fill="#facc15" stroke="#b45309" stroke-width="2" />
              <path d="M 78 112 L 78 106 Q 85 100 92 106 L 92 112" fill="none" stroke="#b45309" stroke-width="2.5"
                stroke-linecap="round" />
              <circle cx="85" cy="120" r="2.5" fill="#78350f" />
            </g>

            <!-- Mechanical Gauntlets -->
            <ellipse cx="32" cy="85" rx="8" ry="11" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.5" />
            <ellipse cx="138" cy="85" rx="8" ry="11" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.5" />

            <!-- Laser Security Pointer Wand held in hand -->
            <g class="security-wand">
              <line x1="140" y1="88" x2="155" y2="108" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />
              <circle cx="158" cy="112" r="6" fill="#f43f5e" stroke="#be123c" stroke-width="2" />
              <line x1="158" y1="112" x2="168" y2="128" stroke="#f43f5e" stroke-width="2" stroke-dasharray="2,3" />
            </g>
          </g>
        </svg>

        <span class="click-badge badge-cyber">shield!</span>
      </div>

    </div>

    <!-- Company Branding & Landing Soon -->
    <header class="brand-showcase">
      <div class="brand-crest" aria-hidden="true">
        <svg viewBox="0 0 44 44" width="38" height="38">
          <!-- Colorful leaf with cyber circuit & travel compass styling -->
          <circle cx="22" cy="22" r="19" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
          <path d="M10 32 Q22 32 30 18 Q34 8 34 6 Q32 6 20 10 Q10 18 10 32 Z" fill="#22c55e" stroke="#15803d"
            stroke-width="2" />
          <line x1="22" y1="12" x2="22" y2="32" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
          <circle cx="22" cy="22" r="3.5" fill="#facc15" stroke="#b45309" stroke-width="1.5" />
        </svg>
      </div>

      <h1 class="brand-title">Thinairatech</h1>

      <div class="landing-tagline">
        <p class="tagline-text">
          landing soon <span class="dot-jump dj-1">.</span><span class="dot-jump dj-2">.</span><span
            class="dot-jump dj-3">.</span><span class="dot-jump dj-4">.</span>
        </p>
      </div>
    </header>

  </main>

  <!-- Rolling Lush Green Landscape Base -->
  <footer class="landscape-base" aria-hidden="true">
    <svg class="base-hills" viewBox="0 0 1440 180" preserveAspectRatio="none">
      <path d="M0,80 C360,30 720,130 1100,60 C1280,30 1380,85 1440,75 L1440,180 L0,180 Z" fill="#86efac"
        opacity="0.6" />
      <path d="M0,105 C260,60 620,140 980,85 C1220,50 1360,110 1440,95 L1440,180 L0,180 Z" fill="#4ade80"
        opacity="0.85" />
      <path d="M0,130 C380,95 720,160 1100,120 C1280,100 1380,135 1440,125 L1440,180 L0,180 Z" fill="#22c55e" />
    </svg>
  </footer>

  <script src="script.js"></script>
</body>

</html>
